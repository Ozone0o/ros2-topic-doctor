name: Roscope CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff build
          pip install -e . --no-deps
      - name: Run tests
        run: pytest -q
      - name: Lint Roscope packages
        run: ruff check src tests examples
      - name: Check formatting
        run: ruff format --check src/roscope
      - name: Compile packages
        run: python -m compileall -q src
      - name: Build and smoke-test wheel
        run: |
          python -m build
          python -m venv /tmp/roscope-wheel-smoke
          /tmp/roscope-wheel-smoke/bin/pip install --no-deps dist/roscope-*.whl
          /tmp/roscope-wheel-smoke/bin/roscope --help
